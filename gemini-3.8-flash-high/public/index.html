<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Кнопка «Сделать Заебись» — Абсолютный Кайф</title>
  <meta name="description" content="Нажми кнопку «Сделать заебись» и погрузись в зрелищный хаос, взрывные спецэффекты и неприлично-абсурдный уровень заебистности!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fullscreen visual effects canvases -->
  <canvas id="bg-canvas"></canvas>
  <canvas id="particle-canvas"></canvas>

  <!-- Flash overlay for epic drops -->
  <div id="flash-overlay"></div>

  <!-- Disco ball -->
  <div id="disco-ball-container">
    <div id="disco-ball"></div>
    <div id="disco-beam-left"></div>
    <div id="disco-beam-right"></div>
  </div>

  <!-- Floating meme text & popup containers -->
  <div id="meme-text-container"></div>
  <div id="popup-container"></div>

  <!-- Main User Interface Container -->
  <main id="app-wrapper">
    <!-- Top HUD: Zaebis-meter, Combo, Stats -->
    <header id="hud">
      <div class="hud-top-bar">
        <div class="brand">
          <span class="brand-badge">⚡ ZAЁBIS 3000 TURBO ⚡</span>
        </div>
        <div class="sound-toggle-wrap">
          <button id="sound-btn" title="Включить/выключить звук" aria-label="Звук">
            <span id="sound-icon">🔊</span>
            <span id="sound-label">Звук: ВКЛ</span>
          </button>
        </div>
      </div>

      <!-- Meter & Status -->
      <div class="meter-card">
        <div class="meter-header">
          <div class="meter-title-wrap">
            <span class="meter-title">ШКАЛА ЗАЕБИСТОСТИ</span>
            <span id="status-badge" class="status-badge">0% — Серая обыденность 🥱</span>
          </div>
          <div class="meter-percent-wrap">
            <span id="percent-val">0</span><span class="percent-sign">%</span>
          </div>
        </div>

        <div class="progress-bar-track">
          <div id="progress-bar-fill"></div>
          <div id="progress-bar-glow"></div>
        </div>

        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-label">Всего нажатий</span>
            <span id="clicks-count" class="stat-num">0</span>
          </div>
          <div class="stat-item combo-item">
            <span class="stat-label">КОМБО-МНОЖИТЕЛЬ</span>
            <span id="combo-multiplier" class="stat-num combo-num">x1</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Скорость (CPS)</span>
            <span id="cps-val" class="stat-num">0.0</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Center Stage: Giant Zaebis Button -->
    <section id="stage">
      <div id="button-aura" class="button-aura"></div>
      <div id="shockwave-holder"></div>

      <div class="button-container">
        <button id="zaebis-btn" class="zaebis-button" type="button">
          <div class="btn-shine"></div>
          <div class="btn-content">
            <span class="btn-emoji" id="btn-emoji">✨</span>
            <span class="btn-main-text" id="btn-text">СДЕЛАТЬ ЗАЕБИСЬ</span>
            <span class="btn-subtext" id="btn-subtext">НАЖМИ ИЛИ ЗАЖМИ ДЛЯ ТУРБО-ХАОСА</span>
          </div>
        </button>
      </div>

      <!-- Combo hype banner -->
      <div id="combo-hype" class="combo-hype-banner">
        <span id="combo-hype-text">ЖМИ БЫСТРЕЕ ДЛЯ УЛЬТРА-КОМБО! 🔥</span>
      </div>
    </section>

    <!-- Bottom Controls & Instructions -->
    <footer id="footer">
      <div class="tips-box">
        <span class="tip-kbd">ПРОБЕЛ</span> или <span class="tip-kbd">КЛИК</span> — давить кайф |
        <span class="tip-kbd">ЗАЖАТЬ</span> — пулемётный авто-заебись 🚀
      </div>
      <div class="footer-actions">
        <button id="reset-btn" class="reset-button" title="Сбросить уровень хаоса">Сбросить в ноль 🔄</button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
