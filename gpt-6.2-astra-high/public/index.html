<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141614">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<title>ХАОС — генератор заебистости</title>
</head>
<body>
<main>
<header><h1><span class="mark" aria-hidden="true">▰</span> ХАОС<span class="slash">//</span>OS</h1><span class="online"><i></i> СИСТЕМА ОНЛАЙН</span></header>
<section class="machine" aria-label="Генератор заебистости">
<span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span>
<div class="nameplate"><strong>ГЕНЕРАТОР ЗАЕБИСТОСТИ</strong><span class="vents"></span><small>MODEL Z–01</small></div>
<div class="bezel"><div class="screen">
<canvas id="scene" aria-hidden="true"></canvas>
<div class="hud"><span>┌ SYS.VISUAL</span><span>LIVE <b>●</b></span></div>
<div class="readout"><span>НАЖАТИЯ</span><strong id="count">000</strong></div>
<div class="power"><span>ИНТЕНСИВНОСТЬ</span><div id="meter"></div></div>
<span class="status" role="status" id="status">● ОЖИДАНИЕ</span>
</div></div>
<div class="panel"><div class="panel-label"><span class="hazard"></span> ИМПУЛЬС</div>
<button id="fire"><span class="bolt" aria-hidden="true">ϟ</span> сделать заебись</button>
<div class="keyhint"><kbd>␣</kbd> ПРОБЕЛ</div></div>
</section>
<footer><span><i></i> ПИТАНИЕ В НОРМЕ</span><span class="barcode" aria-hidden="true"></span></footer>
</main>
<canvas id="bursts" aria-hidden="true"></canvas>
<script src="app.js"></script>
</body></html>
